name: Local workflow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results.xml
  offline-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker build runs actual non-root, IP-blocked initialization + validation.
      - run: docker build -t architecture-reviewer:test .
      - run: docker run --rm --network=none --cpus=2 --memory=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges architecture-reviewer:test python scripts/offline_smoke.py > offline-smoke.json
      - run: docker run --rm --network=none --cpus=2 --memory=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges architecture-reviewer:test python scripts/verify_workflow.py --require-validation > fixture-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-validation-reports
          path: |
            offline-smoke.json
            fixture-verification.json
