services:
  reviewer:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8501/_stcore/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
      - /home/app/.streamlit:rw,nosuid,nodev,size=1m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
