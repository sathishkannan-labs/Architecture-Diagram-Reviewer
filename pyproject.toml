[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-diagram-reviewer"
version = "0.5.0"
description = "Human-reviewed diagrams to traceable, validated AWS Terraform"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.4", "fastapi==0.115.12", "uvicorn==0.34.2",
  "streamlit==1.45.1", "jinja2==3.1.6", "Pillow==11.2.1",
  "python-multipart==0.0.20", "httpx==0.28.1"
]
[project.optional-dependencies]
test = ["pytest==8.3.5"]
[tool.setuptools.package-data]
archreview = ["templates/*.j2", "provider.lock.hcl", "data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
